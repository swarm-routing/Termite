description = "Termite (Roth & Wicker, 2003/2005) as a standalone swarm routing protocol for MANETs: routing by stigmergy, pheromone carried inside data packets, no control ants, randomised multipath forwarding. A simulator-agnostic C++ core and an ns-3 contrib module on swarm-core."
