# org-sync configuration (swarm-routing/.github tools/org-sync).
kind = "protocol"
# CITATION.cff seed and cite badge. Once Zenodo archives a release: set zenodo_concept = "<record id>"
# (read from Zenodo), then `org_sync.py reseed CITATION.cff` so CITATION.cff names the DOI.
citation = true
# the Zenodo concept record (read from zenodo.org on 2026-11-11, v0.1.0 archived)
zenodo_concept = "24124722"
title = "Termite"
dual = ["core/"]

[settings]
# GitHub settings as code: swarm-routing/.github tools/repo-settings (swarm-routing/.github#117).
description = "Termite (Roth & Wicker, 2003/2005) as a standalone swarm routing protocol for MANETs: routing by stigmergy, pheromone carried inside data packets, no control ants, randomised multipath forwarding. A simulator-agnostic C++ core and an ns-3 contrib module on swarm-core."
homepage = "https://swarm-routing.github.io/arena/Termite/"
topics = ["termite", "stigmergy", "swarm-intelligence", "multipath-routing", "manet", "ad-hoc-routing", "routing-protocol", "ns-3", "network-simulation"]
ruleset = "protocol"
required_checks = ["check / org-sync", "headers / licence", "title / title", "core", "ci / ns-latest debug", "ci / ns-latest sanitized", "ci / format", "ci / headers / licence", "swarm-core / pin"]
# Merge through a merge queue (swarm-routing/.github#130); every workflow behind a required
# check also runs on merge_group.
merge_queue = true

# The work this repository implements or builds on: the README's Releases &
# citing list and CITATION.cff's references (swarm-routing/.github org-sync,
# #228). Every DOI confirmed with lit_search.py confirm; fields from Crossref.

[[references]]
type = "thesis"
title = "Termite: A Swarm Intelligent Routing Algorithm For Mobile Wireless Ad-Hoc Networks"
authors = ["Roth, Martin"]
year = 2005
venue = "Cornell University"
thesis_type = "PhD dissertation"
url = "https://hdl.handle.net/1813/240"
no_doi = "a dissertation in Cornell's eCommons repository."
role = "The primary source this repository implements."

