volume = "5"
pages = "2937-2941"
publisher = "IEEE"
doi = "10.1109/GLOCOM.2003.1258772"
role = "The protocol's first paper (GLOBECOM 2003)."

[[references]]
type = "book"
title = "Termite: A swarm intelligent routing algorithm for mobile wireless Ad-Hoc networks"
authors = ["Roth, Martin", "Wicker, Stephen"]
