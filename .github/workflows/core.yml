name: Core

# Termite's simulator-free core/ on its own (plain CMake + ctest, no ns-3
# tree), with the org's quality gates for C++: strict warnings as errors (in
# core/CMakeLists.txt), the tests under ASan + UBSan, and clang-format with the
# org .clang-format. swarm-core's primitives come from the commit
# core/CMakeLists.txt pins. Once ns3/ exists, reusable-ns3-ci.yml builds the
# same sources inside ns-3 as well. The check name is `core`.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:  # the merge queue runs the required checks on each group (swarm-routing/.github#130)

permissions:
  contents: read

jobs:
  core:
    name: core
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swarm-routing/.github
          path: .org
          sparse-checkout: .clang-format
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Build and test (debug, strict warnings)
        run: |
          cmake -S core -B build/debug -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/debug -j "$(nproc)"
          ctest --test-dir build/debug --output-on-failure
      - name: Build and test (ASan + UBSan)
        run: |
          cmake -S core -B build/sanitized -DCMAKE_BUILD_TYPE=Debug -DTERMITE_CORE_SANITIZE=ON \
            -DSWARM_CORE_DIR="$PWD/build/debug/_deps/swarm_core_src-src/core"
          cmake --build build/sanitized -j "$(nproc)"
          ctest --test-dir build/sanitized --output-on-failure
      - name: Format (org .clang-format)
        run: git ls-files 'core/*.h' 'core/*.cc' | xargs clang-format-18 --style=file:.org/.clang-format --dry-run --Werror
