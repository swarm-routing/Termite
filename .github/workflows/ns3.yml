name: ns-3

# The `termite` contrib module (ns3/, which compiles core/ as well) in
# ghcr.io/swarm-routing/ns3-dev (debug and sanitized, the release ns-3
# supports), on swarm-core `main` (swarm-core golden rule 12: protocols build
# against main), with the org quality gates: strict warnings, coverage
# (report-only, to Codecov), SonarQube Cloud, clang-format and licence headers.
# routing-bench (swarm-routing/ns3-tools) is built beside it so the harness arm
# (ns3/helper/termite-bench-arms.cc) compiles and runs.
#
# No determinism program yet: the core's first slice has no hello, seed or
# route request (#6), so a fresh network delivers nothing and every seed would
# print the same. test.py's determinism case covers it on a laid trail until
# an example delivers; then `determinism:` names that example.
#
# core/ also builds alone against swarm-core at SWARM_CORE_REF (core.yml). The
# `swarm-core pin` job keeps the two in step: it fails when swarm-core main's
# core/ differs from the pinned commit's, so a change there is met by a pin
# bump here (core/CMakeLists.txt, Makefile, licence.yml and the core-deps
# below, all one SHA, which the job also checks).
on:
  push:
    branches: [main]
  pull_request:
  merge_group:  # the merge queue runs the required checks on each group (swarm-routing/.github#130)
  workflow_dispatch:
    inputs:
      ns3-versions:
        description: 'On demand: JSON list of older ns-3 releases (3.42+), e.g. ["3.48"]'
        default: ''
      profiles:
        description: 'On demand: JSON list of image profiles. Older releases have a debug image; a sanitized one only where it was built on request (e.g. 3.48)'
        default: '["debug"]'

permissions:
  contents: read
  packages: read

jobs:
  ci:
    uses: swarm-routing/.github/.github/workflows/reusable-ns3-ci.yml@main
    with:
      modules: termite=ns3
      dependencies: |
        swarm-core=swarm-routing/ns3-swarm-core@main
        routing-bench=swarm-routing/ns3-tools@main:ns3/routing-bench
      ns3-versions: ${{ inputs.ns3-versions || '["latest"]' }}
      profiles: ${{ inputs.ns3-versions != '' && inputs.profiles || '["debug", "sanitized"]' }}
      # Older images may predate these options: automatic `latest` legs only.
      strict-warnings: ${{ inputs.ns3-versions == '' }}
      coverage: ${{ inputs.ns3-versions == '' }}
      sonar: ${{ inputs.ns3-versions == '' }}
      # The harness runs the arm, as ns3-tools runs its stock arms. It delivers
      # nothing until the core can learn a destination (#6); the run checks
      # that the arm registers and runs clean (sanitizers included).
      run: routing-compare --scenario=paper --nNodes=20 --time=30 --runs=1 --protocols=termite
      dual-roots: 'core/'
      core-roots: 'core/'
      core-deps: swarm-routing/ns3-swarm-core@206954e225f1098eb78fb8c2a72ffdd77627d7a8:core
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # The coverage report of the `ci` job to Codecov (report-only; GitHub OIDC).
  codecov:
    needs: ci
    if: inputs.ns3-versions == ''
    permissions:
      contents: read
      id-token: write
    uses: swarm-routing/.github/.github/workflows/reusable-codecov.yml@main

  pin:
    name: swarm-core pin
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The pin is one SHA, and swarm-core main's core/ is the pinned core/
        run: |
          set -euo pipefail
          pin=$(sed -n 's/^set(SWARM_CORE_REF "\([0-9a-f]\{40\}\)".*/\1/p' core/CMakeLists.txt)
          [ -n "$pin" ] || { echo "::error::no SWARM_CORE_REF in core/CMakeLists.txt"; exit 1; }
          fails=0
          for f in Makefile .github/workflows/licence.yml .github/workflows/ns3.yml; do
            grep -q "$pin" "$f" || { echo "::error file=$f::does not name swarm-core $pin (core/CMakeLists.txt's SWARM_CORE_REF)"; fails=1; }
          done
          git clone --quiet --filter=blob:none --no-checkout \
            https://github.com/swarm-routing/ns3-swarm-core.git "$RUNNER_TEMP/swarm-core"
          main=$(git -C "$RUNNER_TEMP/swarm-core" rev-parse origin/main)
          if ! git -C "$RUNNER_TEMP/swarm-core" diff --quiet "$pin" "$main" -- core/; then
            echo "::error::swarm-core main ($main) changed core/ since the pin ($pin): bump SWARM_CORE_REF in core/CMakeLists.txt, Makefile, licence.yml and ns3.yml"
            git -C "$RUNNER_TEMP/swarm-core" diff --stat "$pin" "$main" -- core/
            fails=1
          fi
          [ "$fails" = 0 ] && echo "ok: core/ at $pin is swarm-core main's ($main)"
          exit "$fails"
