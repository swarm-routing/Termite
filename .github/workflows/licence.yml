name: Licence

# core/ is MIT OR GPL-2.0-only and includes only the C++ standard library,
# other core/ files and swarm-core's dual-licensed core/ at the commit
# core/CMakeLists.txt pins (SWARM_CORE_REF; bump both together); everything
# else is GPL-2.0-only (LICENSING.md).
on:
  push:
    branches: [main]
  pull_request:
  merge_group:  # the merge queue runs the required checks on each group (swarm-routing/.github#130)

permissions:
  contents: read

jobs:
  headers:
    uses: swarm-routing/.github/.github/workflows/reusable-licence-check.yml@main
    with:
      dual-roots: core/
      core-roots: core/
      core-deps: swarm-routing/ns3-swarm-core@206954e225f1098eb78fb8c2a72ffdd77627d7a8:core
