# Releases go through swarm-routing/.github's reusable-release.yml
# (.github/workflows/release.yml; CONTRIBUTING "Cutting a release" there).
# The first release is v0.1.0; Commitizen then bumps from the Conventional
# Commits since the last tag. The release notes are the version's section of
# CHANGELOG.md, rendered from .cz-changelog.md.j2 (it adds the release status).
[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_scheme = "semver"
tag_format = "v$version"
major_version_zero = true
update_changelog_on_bump = true
template = ".cz-changelog.md.j2"
