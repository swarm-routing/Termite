# The swarm-core release this repository builds on (swarm-routing/ns3-swarm-core#134):
# core/CMakeLists.txt fetches its tarball by URL and checks it against the
# SHA256 below, read from the release's SHA256SUMS. The Makefile and every
# workflow name the same release (the tag, or in benchmark-cell.yml the
# commit it names). Never edit it by hand: org-bot's swarm-core-pin task opens
# the bump PR when a newer release is out (swarm-routing/.github
# tools/checks/check-swarm-core-pin.py --bump, which writes it with
# tools/checks/release_lock.py), and the `swarm-core / pin` check verifies it.
